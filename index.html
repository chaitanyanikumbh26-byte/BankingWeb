<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrustPay Bank - Modern Digital Banking</title>
  <link rel="stylesheet" href="utils.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar flex justify-between align-center container">
    <div class="logo flex align-center">
      <img src="bank-logo1.png" alt="TrustPay Bank Logo">
      <span class="bank-name">TrustPay Bank</span>
    </div>

    <nav class="nav-links flex align-center" aria-label="Main Navigation">
      <a href="#accounts">Accounts</a>
      <a href="#loans">Loans</a>
      <a href="#investments">Investments</a>
      <a href="#support">Support</a>
      <a href="#contact">Contact</a>
    </nav>

    <div class="actions flex align-center">
      <button class="search-btn" aria-label="Search">🔍</button>
      <button class="login-btn">Log in</button>
      <button class="cta-btn">Open Account</button>
    </div>
  </header>

  <main class="main-section flex justify-between align-center container">
    <div class="main-text">
      <h1>Banking Made Simple &amp; Secure</h1>
      <p>Experience seamless digital banking with TrustBest Bank — where your money grows safely and smartly.</p>
      <button class="cta-btn">Get Started</button>
    </div>

    <div class="main-image">
      <img src="bank-illustration.png" alt="Digital Banking Illustration">
    </div>
  </main>

</body>
</html>
